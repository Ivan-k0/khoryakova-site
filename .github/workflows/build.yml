name: Build site

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "templates/**"
      - "scripts/**"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: node scripts/build.js

      - name: Commit generated pages
        run: |
          git config user.name "site-builder"
          git config user.email "actions@users.noreply.github.com"
          git add index.html en/index.html ru/index.html blog/ en/blog/ ru/blog/
          if git diff --cached --quiet; then
            echo "Nothing changed, skipping commit."
          else
            git commit -m "Rebuild site [skip ci]"
            git push
          fi
